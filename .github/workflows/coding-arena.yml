
name: Generate Coding Arena Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Coding Arena SVG
        run: python scripts/generate_coding_arena.py

      - name: Commit generated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add coding-arena.svg

          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
          else
            git commit -m "Update Coding Arena Dashboard"
            git push
          fi
