
name: Advanced GitHub Metrics

on:
  schedule:
    # Daily at 8:00 AM IST
    - cron: "30 2 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  github-metrics:
    name: Generate GitHub Metrics
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Authentication
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}

          # GitHub profile
          user: SanjanaGadamsetty
          filename: github-metrics.svg

          # Appearance
          template: classic
          config_timezone: Asia/Kolkata
          config_display: large
          config_animations: yes
          config_twemoji: yes

          # Main profile statistics
          base: header, activity, community, repositories, metadata

          # Programming languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_languages_categories: programming, markup

          # Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Recently starred repositories
          plugin_stars: yes
          plugin_stars_limit: 4

          # Temporarily disabled failing plugins
          plugin_habits: no
          plugin_activity: no
          plugin_achievements: no
