name: Neon Tech README Control Center
on:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/build_readme.py'
      - '.github/workflows/readme-control-center.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: neon-tech-readme-builder
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build README from switches
        run: python scripts/build_readme.py
      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: update enabled README features'
          git push
